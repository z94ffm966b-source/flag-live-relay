<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>QUIZ CULTURE G — LIVE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{box-sizing:border-box}

:root{
 --bg:#080b18;
 --green:#22c875;
 --blue:#36aaff;
 --red:#ff5368;
 --yellow:#ffbd35;
 --purple:#a477ff;
}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-start;
 gap:18px;
 padding:20px;
 background:
 radial-gradient(ellipse at 50% 0%,#253b72 0%,transparent 55%),
 linear-gradient(145deg,#070b18,#10152b 55%,#080b18);
 color:white;
 font-family:Inter,Arial,sans-serif;
}

.live-screen{
 width:min(100%,440px);
 min-height:calc(min(100vh - 30px,780px));
 aspect-ratio:9/16;
 max-height:900px;
 padding:17px;
 border:1px solid #ffffff20;
 border-radius:25px;
 background:
 radial-gradient(ellipse at 50% 0%,#243c73 0%,transparent 48%),
 linear-gradient(180deg,#111b37,#080d1e 75%);
 box-shadow:0 25px 90px #0009;
 display:flex;
 flex-direction:column;
 overflow-y:auto;
 overflow-x:hidden;
 scrollbar-width:thin;
 scrollbar-color:#52658d transparent;
 flex-shrink:0;
}
.live-screen::-webkit-scrollbar{width:4px}
.live-screen::-webkit-scrollbar-thumb{background:#52658d;border-radius:8px}

/* Présentation verticale propre pour la diffusion TikTok. */
.live-screen{
 overflow:hidden;
 scrollbar-width:none;
 min-height:0;
 height:min(calc(100vh - 24px),780px);
 max-height:calc(100vh - 24px);
 padding:12px;
 border-radius:18px;
}
.live-screen::-webkit-scrollbar{display:none}
body.broadcast-mode{
 width:100%;
 min-height:100vh;
 height:auto;
 padding:10px;
 margin:0;
 gap:12px;
 justify-content:flex-start;
 align-items:center;
 overflow-x:hidden;
 overflow-y:auto;
 background:#050813;
}
body.broadcast-mode .live-screen{
 zoom:.5;
 width:360px;
 height:640px;
 min-height:0;
 max-height:640px;
 aspect-ratio:9/16;
 overflow:hidden!important;
 border-radius:14px;
 border:1px solid #ffffff20;
 box-shadow:0 8px 28px #0008;
 padding:8px;
 flex:0 0 auto;
 margin-left:auto;
 margin-right:auto;
}
body.broadcast-mode .header{gap:5px}
body.broadcast-mode .brand{font-size:clamp(12px,1.7vh,15px)}
body.broadcast-mode .creator{margin-top:4px;font-size:9px}
body.broadcast-mode .likes{margin-top:7px}
body.broadcast-mode .question-card{margin-top:8px;padding:clamp(9px,1.2vh,13px) 9px}
body.broadcast-mode .theme{margin-bottom:5px;font-size:8px}
body.broadcast-mode .question-text{font-size:clamp(13px,2vh,17px)}
body.broadcast-mode .timer-area{margin-top:8px}
body.broadcast-mode .answers{gap:6px;margin-top:8px}
body.broadcast-mode .answer{min-height:clamp(42px,5.3vh,54px);padding:6px;font-size:clamp(9px,1.15vh,11px)}
body.broadcast-mode .answer-letter{width:24px;height:24px}
body.broadcast-mode .chat-instruction{margin-top:6px;font-size:9px}
body.broadcast-mode .vote-count{margin-top:2px;font-size:8px}
body.broadcast-mode .vote-ticker{height:27px;margin-top:4px}
body.broadcast-mode .message-bar{min-height:30px;margin-top:6px;padding:5px}
body.broadcast-mode .gifts{gap:5px;margin-top:8px}
body.broadcast-mode .gift{padding:6px 2px}
body.broadcast-mode .gift-emoji{font-size:18px}
body.broadcast-mode .ranking{margin-top:7px;padding:6px}
body.broadcast-mode .ranking-row{padding:2px 0;font-size:9px}
body.broadcast-mode .ranking-row:nth-child(n+6){display:flex}
body.broadcast-mode .ranking-title{font-size:8px;margin-bottom:3px}
body.broadcast-mode .bottom-status{padding-top:4px}
body.broadcast-mode .voice-button{margin-top:5px;padding:6px}
body.broadcast-mode .podium{margin-top:5px;padding:6px}
body.broadcast-mode .question-card{margin-top:clamp(5px,.7vh,8px);padding:clamp(7px,.9vh,10px) 8px}
body.broadcast-mode .question-text{font-size:clamp(11px,1.65vh,15px);line-height:1.18}
body.broadcast-mode .double-badge{font-size:7px;padding:3px 5px}
body.broadcast-mode .likes{margin-top:clamp(6px,.8vh,9px)}
body.broadcast-mode .answers{gap:clamp(4px,.6vh,7px);margin-top:clamp(6px,.8vh,9px)}
body.broadcast-mode .answer{min-height:clamp(38px,5vh,50px);padding:6px;font-size:clamp(8px,1vh,10px)}
body.broadcast-mode .answer-letter{width:23px;height:23px}
body.broadcast-mode .vote-ticker{height:28px;margin-top:5px}
body.broadcast-mode .chat-instruction{margin-top:5px;font-size:9px}
body.broadcast-mode .ranking{margin-top:5px;padding:5px}
body.broadcast-mode #rankingList{max-height:none;overflow:visible}
body.broadcast-mode .ranking-row{min-height:15px;padding:0;font-size:7px}
body.broadcast-mode .rank-avatar{width:15px;height:15px;font-size:6px}
body.broadcast-mode .rank-number{width:14px;font-size:8px}
body.broadcast-mode .rank-score{font-size:8px}
body.broadcast-mode .ranking-row:nth-child(n+6){display:flex}
body.broadcast-mode .ranking-title{font-size:8px;margin-bottom:3px}
body.broadcast-mode .bottom-status{padding-top:4px}
body.broadcast-mode .voice-button{margin-top:5px;padding:6px}
body.broadcast-mode .podium{margin-top:5px;padding:6px}
body.broadcast-mode .simulator{
 display:block;
 width:min(100%,760px);
 margin:0 auto;
 flex-shrink:0;
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.brand{
 font-size:15px;
 font-weight:900;
 letter-spacing:1.2px;
}

.question-number{
 background:#ffffff12;
 border:1px solid #ffffff25;
 border-radius:20px;
 padding:8px 10px;
 font-size:10px;
 font-weight:900;
 white-space:nowrap;
}

.creator{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:7px;
 color:#c2cde8;
 font-size:10px;
 font-weight:700;
}

.creator-name{color:#fff}
.live-indicator{color:#ff7188;font-weight:900}

.likes{margin-top:13px}

.likes-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:9px;
 font-weight:800;
 color:#d9e3ff;
}

.likes-number{color:#ff7192;font-size:12px}
.likes-goal-note{margin-top:5px;color:#ffb5c5;font-size:8px;line-height:1.35;font-weight:800;letter-spacing:.25px}

.likes-track{
 height:8px;
 background:#ffffff18;
 border-radius:20px;
 overflow:hidden;
 margin-top:7px;
}

.likes-fill{
 height:100%;
 width:0%;
 border-radius:20px;
 background:linear-gradient(90deg,#ff547e,#ff9d63);
 transition:width .4s ease;
}

.question-card{
 position:relative;
 background:#fff;
 color:#111827;
 border-radius:16px;
 padding:20px 12px 15px;
 margin-top:15px;
 text-align:center;
 box-shadow:0 7px 25px #0003;
}

.theme{
 color:#159d5c;
 font-size:10px;
 font-weight:900;
 letter-spacing:2px;
 text-transform:uppercase;
 margin-bottom:8px;
}

.question-text{
 font-size:clamp(16px,4vw,21px);
 line-height:1.3;
 font-weight:900;
}

.double-badge{
 display:none;
 position:absolute;
 top:7px;
 right:8px;
 padding:4px 7px;
 border-radius:20px;
 background:#ffbd35;
 color:#271900;
 font-size:8px;
 font-weight:900;
 box-shadow:0 2px 8px #0002;
}

.double-badge.visible{display:block}

.timer-area{margin-top:13px}

.timer-label{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:9px;
 font-weight:800;
 color:#d7e2ff;
 margin-bottom:6px;
}

.timer-number{color:#58d7ff;font-size:12px}

.timer-track{
 width:100%;
 height:10px;
 background:#ffffff19;
 border-radius:20px;
 overflow:hidden;
}

.timer-fill{
 height:100%;
 width:100%;
 background:linear-gradient(90deg,#32df9a,#36baff);
 border-radius:20px;
 transition:width 1s linear;
}

.answers{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:14px;
}

.answer{
 min-height:62px;
 display:flex;
 align-items:center;
 gap:8px;
 padding:9px;
 border-radius:12px;
 color:white;
 font-size:11px;
 font-weight:800;
 border:1px solid #ffffff35;
 box-shadow:0 4px 12px #0003;
 transition:.2s;
}

.answer-letter{
 width:27px;
 height:27px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:8px;
 background:#ffffff28;
 font-size:12px;
 font-weight:900;
}

.answer-text{text-align:left;line-height:1.25}

.answer-a{background:linear-gradient(135deg,#2775ed,#1645a9)}
.answer-b{background:linear-gradient(135deg,#20b979,#087b50)}
.answer-c{background:linear-gradient(135deg,#e59b23,#b96512)}
.answer-d{background:linear-gradient(135deg,#a05be9,#6335b5)}

.answer.correct{
 outline:3px solid #5bffa9;
 background:linear-gradient(135deg,#159b5c,#087343);
}

.answer.wrong{opacity:.38}

.vote-count{
 margin-top:7px;
 text-align:center;
 color:#aebfe2;
 font-size:8px;
 font-weight:900;
 letter-spacing:.7px;
}

.chat-instruction{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;text-align:center;margin-top:8px;font-size:10px;font-weight:900;letter-spacing:.15px;color:#fff}
.chat-key{width:18px;height:18px;display:inline-grid;place-items:center;border-radius:5px;color:#fff;font-size:10px;font-weight:1000;box-shadow:0 2px 5px #0004}
.chat-key.key-a{background:#ff526c}.chat-key.key-b{background:#287cf0}.chat-key.key-c{background:#17bd69}.chat-key.key-d{background:#ffb900}
.vote-count{margin-top:3px;text-align:center;color:#c6d5f3;font-size:8px;font-weight:800;letter-spacing:.2px}
.vote-ticker{width:100%;height:31px;margin-top:5px;padding:4px 5px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid #ffffff18;border-radius:9px;background:#080f21;scrollbar-width:none;scroll-behavior:smooth}
.vote-ticker::-webkit-scrollbar{display:none}
.vote-pill{display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;background:linear-gradient(90deg,#183d70,#27315c);border:1px solid #5daeff55;color:#eaf4ff;font-size:8px;line-height:1;font-weight:900;animation:votePillIn .22s ease-out}
.answer-percent{flex:none;margin-left:auto;padding:4px 6px;border-radius:7px;background:#07132666;color:#fff;font-size:11px;font-weight:1000}
.answer-letter.letter-a{background:#ff526c;color:#fff}
.answer-letter.letter-b{background:#287cf0;color:#fff}
.answer-letter.letter-c{background:#17bd69;color:#fff}
.answer-letter.letter-d{background:#ffb900;color:#fff}
@keyframes votePillIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes votePillIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

.message-bar{
 width:100%;
 min-height:37px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-top:10px;
 padding:7px 10px;
 border:1px solid #36aaff55;
 border-radius:10px;
 background:linear-gradient(90deg,#17396a,#25204d);
 box-shadow:0 3px 12px #0003;
 overflow:hidden;
 text-align:center;
}

.message-text{
 font-size:9px;
 line-height:1.3;
 font-weight:900;
 letter-spacing:.3px;
 color:#fff;
 animation:messageAppear .35s ease;
}

.message-text.highlight{color:#ffda75}
.message-text.thanks{color:#65f2b0}

@keyframes messageAppear{
 from{opacity:0;transform:translateY(5px)}
 to{opacity:1;transform:translateY(0)}
}

.gifts{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:15px;
}

.gift{
 min-width:0;
 text-align:center;
 padding:9px 2px;
 border-radius:12px;
 background:#ffffff0c;
 border:1px solid #ffffff22;
}

.gift-emoji{font-size:23px}

.gift-name{
 font-size:8px;
 font-weight:900;
 margin-top:4px;
}

.gift-description{
 color:#aab8d8;
 font-size:7px;
 margin-top:4px;
 line-height:1.3;
}

.gift.rose{border-color:#ff8db555}
.gift.ice{border-color:#62caff55}
.gift.bomb{border-color:#ff637855}

.part{margin-top:14px}

.part-label{
 display:flex;
 justify-content:space-between;
 font-size:9px;
 color:#c6d2ee;
 font-weight:800;
 margin-bottom:6px;
}

.part-track{
 height:7px;
 border-radius:20px;
 background:#ffffff17;
 overflow:hidden;
}

.part-fill{
 height:100%;
 width:6.25%;
 background:linear-gradient(90deg,#36c5ff,#a477ff);
 border-radius:20px;
 transition:width .4s;
}

.ranking{
 margin-top:9px;
 padding:7px;
 border:1px solid #ffffff20;
 border-radius:13px;
 background:#ffffff0b;
}
#rankingList{display:block;max-height:150px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#52658d transparent}
#rankingList::-webkit-scrollbar{width:3px}
#rankingList::-webkit-scrollbar-thumb{background:#52658d;border-radius:5px}

.ranking-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:10px;
 font-weight:900;
 letter-spacing:1px;
 margin-bottom:7px;
}

.ranking-title span{color:#ffda75;font-size:9px}

.ranking-row{
 display:flex;
 align-items:center;
 gap:6px;
 min-height:21px;
 padding:2px 0;
 border-bottom:1px solid #ffffff0c;
 font-size:8px;
}

.ranking-row:last-child{border-bottom:0}\n.ranking-waiting{opacity:.58}\n.ranking-waiting .rank-avatar{background:#ffffff12;color:#8fa2c8;border:1px dashed #ffffff35}

.rank-number{
 width:19px;
 font-weight:900;
 color:#aab9d8;
}

.rank-avatar{
 width:22px;
 height:22px;
 display:grid;
 place-items:center;
 border-radius:50%;
 background:linear-gradient(135deg,#36c5ff,#9065ff);
 font-size:9px;
 font-weight:900;
}

.rank-name{
 flex:1;
 font-weight:700;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.rank-score{
 color:#5ce6a4;
 font-weight:900;
 white-space:nowrap;
}

.bottom-status{
 margin-top:auto;
 padding-top:9px;
 text-align:center;
 font-size:8px;
 color:#8c9dc3;
 letter-spacing:1.5px;
}

.voice-button{
 margin-top:9px;
 width:100%;
 border:1px solid #62caff66;
 border-radius:10px;
 padding:9px;
 color:white;
 background:#36aaff22;
 font-size:10px;
 font-weight:900;
 cursor:pointer;
}

.voice-button.active{
 background:#159b5c55;
 border-color:#5bffa9;
}

.podium{
 display:none;
 margin-top:12px;
 padding:12px;
 border:1px solid #ffda7566;
 border-radius:13px;
 background:#ffda7510;
 text-align:center;
}

.podium.visible{display:block}

.podium-title{
 font-size:12px;
 font-weight:900;
 color:#ffda75;
 margin-bottom:8px;
}

.podium-line{
 font-size:10px;
 font-weight:800;
 padding:4px;
}

/* ÉCRANS SPÉCIAUX */

.special-screen{
 display:none;
 flex:1;
 flex-direction:column;
 justify-content:center;
 gap:12px;
 text-align:center;
 padding:12px 3px;
 min-height:0;
}

.live-screen.is-special > :not(.special-screen){
 display:none;
}

.live-screen.is-special .special-screen{
 display:flex;
}

.special-heading{
 font-size:23px;
 font-weight:900;
 color:#ffda75;
 line-height:1.25;
}

.special-subheading{
 font-size:10px;
 line-height:1.5;
 color:#c6d2ee;
}
.special-countdown{
 margin-top:12px;
 padding:10px 12px;
 border-radius:10px;
 background:#36aaff18;
 border:1px solid #36aaff55;
 color:#8edcff;
 font-size:12px;
 font-weight:900;
 text-align:center;
 animation:messageAppear .3s ease;
}

.special-ranking{
 display:flex;
 flex-direction:column;
 gap:7px;
 margin-top:8px;
}

.special-ranking-row{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 background:#ffffff12;
 border:1px solid #ffffff20;
 border-radius:10px;
 font-size:11px;
}

.special-ranking-row .rank-number{
 width:24px;
 font-size:12px;
}

.special-ranking-row .rank-name{
 flex:1;
 text-align:left;
}

.special-ranking-row .rank-score{color:#5ce6a4;font-weight:900}
.special-ranking-row:nth-child(-n+3) .rank-number{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:18px;background:#ffda7518;animation:medalPop .65s cubic-bezier(.2,.9,.25,1.3) both}
.special-ranking-row:nth-child(2) .rank-number{animation-delay:.12s}
.special-ranking-row:nth-child(3) .rank-number{animation-delay:.24s}
@keyframes medalPop{from{opacity:0;transform:scale(.45) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.special-ranking-row:nth-child(1){border-color:#ffda7570}
.special-ranking-row:nth-child(2){border-color:#c8d5ee55}
.special-ranking-row:nth-child(3){border-color:#c58b5a66}

.special-button{
 margin-top:12px;
 padding:13px;
 border:0;
 border-radius:10px;
 background:#36aaff;
 color:#07101f;
 font-family:inherit;
 font-size:11px;
 font-weight:900;
 cursor:pointer;
}

.special-button:active{transform:scale(.98)}

.special-winner{
 padding:16px 10px;
 border:1px solid #ffda7566;
 border-radius:13px;
 background:#ffda7510;
}

.special-winner-name{
 color:#ffda75;
 font-size:20px;
 font-weight:900;
 margin-top:7px;
}

.special-winner-score{
 color:#5ce6a4;
 font-size:12px;
 font-weight:900;
 margin-top:5px;
}

/* SIMULATEUR */

.simulator{
 width:min(100%,700px);
 padding:18px;
 border:1px solid #ffffff22;
 border-radius:18px;
 background:linear-gradient(180deg,#141f3c,#0b1124);
 box-shadow:0 15px 45px #0007;
 margin-bottom:30px;
}

.simulator-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px;
}

.simulator-title{
 font-size:16px;
 font-weight:900;
}

.simulator-tag{
 padding:5px 9px;
 border-radius:20px;
 background:#22c87520;
 border:1px solid #22c87555;
 color:#63e9a5;
 font-size:9px;
 font-weight:900;
}

.simulator-description{
 color:#aab8d8;
 font-size:11px;
 line-height:1.5;
 margin-bottom:17px;
}

.sim-section{
 margin-top:15px;
 padding:13px;
 border-radius:12px;
 background:#ffffff08;
 border:1px solid #ffffff16;
}

.sim-section-title{
 font-size:11px;
 font-weight:900;
 letter-spacing:.7px;
 margin-bottom:10px;
 color:#dce7ff;
}

.sim-input{
 width:100%;
 padding:11px;
 border:1px solid #ffffff25;
 border-radius:9px;
 background:#080d1e;
 color:white;
 font-family:inherit;
 font-size:12px;
 outline:none;
}

 .sim-input:focus{border-color:#36aaff}

.sim-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.sim-button{
 min-height:39px;
 padding:9px;
 border:1px solid #ffffff22;
 border-radius:9px;
 background:#ffffff12;
 color:white;
 font-family:inherit;
 font-size:10px;
 font-weight:900;
 cursor:pointer;
 transition:.15s;
}

.sim-button:hover{
 background:#ffffff25;
 transform:translateY(-1px);
}

.sim-button:active{transform:scale(.97)}

.sim-button.blue{background:#2775ed35;border-color:#2775ed88}
.sim-button.green{background:#20b97930;border-color:#20b97988}
.sim-button.pink{background:#ff6d9a25;border-color:#ff6d9a88}
.sim-button.purple{background:#a477ff25;border-color:#a477ff88}
.sim-button.red{background:#ff536825;border-color:#ff536888}
.sim-button.yellow{background:#ffbd3520;border-color:#ffbd3588}

 .auto-sim-feed{
 margin-top:10px;
 padding:9px;
 max-height:170px;
 overflow:auto;
 border:1px solid #ffffff18;
 border-radius:10px;
 background:#080d1e;
}
.auto-sim-feed-title{font-size:9px;font-weight:900;color:#8fa8d8;letter-spacing:.8px;margin-bottom:7px}
.auto-sim-comment{padding:5px 0;border-bottom:1px solid #ffffff0d;font-size:9px;line-height:1.4;color:#dce6ff}
.auto-sim-comment:last-child{border-bottom:0}
.viewer-count{display:none;color:#8df0bd;font-weight:900;font-size:9px;white-space:nowrap}
.viewer-count.visible{display:inline-block}
.sim-status{

function exportQuestionBank(){
 const payload={format:"QUIZ_CULTURE_G_QUESTION_BANK",version:1,total:rawQuestions.length,questions:rawQuestions};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download="quiz-culture-g-banque-320-questions.json";
 document.body.appendChild(link);
 link.click();
 link.remove();
 URL.revokeObjectURL(url);
 if(typeof simStatus==="function")simStatus("Banque de "+rawQuestions.length+" questions exportée en JSON.");
}

async function importQuestionBank(event){
 const file=event.target.files && event.target.files[0];
 if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());
  const candidate=Array.isArray(parsed)?parsed:parsed.questions;
  validateQuestionBank(candidate);
  rawQuestions=candidate.map(q=>q.slice());
  questions=rawQuestions.map(q=>[q[0],q[1],[q[2],q[3],q[4],q[5]],q[6]]);
  questionIndex=Math.min(questionIndex,questions.length-1);
  renderQuestion();
  renderRanking();
  if(typeof simStatus==="function")simStatus("Import réussi : "+questions.length+" questions chargées.");
 }catch(error){
  if(typeof simStatus==="function")simStatus("Import refusé : "+error.message);
  else alert("Import refusé : "+error.message);
 }finally{event.target.value="";}
}

/* =========================================================
   CONNEXION TIKTOK LIVE CONNECTOR — WEBSOCKET CONFIGURABLE
========================================================= */

const LIVE_RELAY_URL="wss://quiz-culture-relay.onrender.com/ws";
const LIVE_RECONNECT_DELAY=15000;
let liveConnectorSocket=null;
let liveConnectorRetryTimer=null;
let liveConnectorManuallyClosed=false;
function connectorStatus(message){const el=$("connectorStatus");if(el)el.textContent=message;}
function scheduleLiveConnectorRetry(){
 if(liveConnectorManuallyClosed||liveConnectorRetryTimer)return;
 liveConnectorRetryTimer=setTimeout(()=>{
  liveConnectorRetryTimer=null;
  connectLiveConnector();
 },LIVE_RECONNECT_DELAY);
}

function openLiveConnectorInterface(){
 const value=$("connectorInterfaceUrl").value.trim();
 if(!value){connectorStatus("Ajoute d'abord l'URL exacte de l'interface fournie par ton connecteur.");return;}
 try{const url=new URL(value);if(!["http:","https:"].includes(url.protocol))throw new Error("URL http(s) requise");window.open(url.href,"_blank","noopener,noreferrer");}
 catch(error){connectorStatus("URL d'interface invalide : "+error.message);}
}

function disconnectLiveConnector(){
 liveConnectorManuallyClosed=true;
 if(liveConnectorRetryTimer){clearTimeout(liveConnectorRetryTimer);liveConnectorRetryTimer=null;}
 if(liveConnectorSocket){liveConnectorSocket.onclose=null;liveConnectorSocket.close();liveConnectorSocket=null;}
 connectorStatus("Connecteur déconnecté manuellement.");
}

function connectLiveConnector(){
 liveConnectorManuallyClosed=false;
 if(liveConnectorSocket&&(liveConnectorSocket.readyState===WebSocket.OPEN||liveConnectorSocket.readyState===WebSocket.CONNECTING))return;
 if(liveConnectorRetryTimer){clearTimeout(liveConnectorRetryTimer);liveConnectorRetryTimer=null;}
 const url=new URL(LIVE_RELAY_URL);
 try{
  connectorStatus("Connexion automatique à @quizzzz123_…");
  liveConnectorSocket=new WebSocket(url.href);
  liveConnectorSocket.onopen=()=>connectorStatus("Relais connecté. Vérification de la connexion TikTok de @quizzzz123_…");
  liveConnectorSocket.onerror=()=>connectorStatus("Relais inaccessible. Nouvelle tentative automatique dans 15 secondes…");
  liveConnectorSocket.onclose=()=>{
   liveConnectorSocket=null;
   if(!liveConnectorManuallyClosed){
    connectorStatus("Connexion interrompue. Nouvelle tentative automatique dans 15 secondes…");
    scheduleLiveConnectorRetry();
   }
  };
  liveConnectorSocket.onmessage=event=>{
   try{handleConnectorEvent(JSON.parse(event.data));}
   catch(error){connectorStatus("Événement reçu mais JSON non reconnu : "+error.message);}
  };
 }catch(error){
  connectorStatus("Impossible de démarrer la connexion. Nouvelle tentative dans 15 secondes…");
  scheduleLiveConnectorRetry();
 }
}

function handleConnectorEvent(data){
 if(!data || typeof data!=="object")return;
 const type=String(data.type||data.event||data.action||"").toLowerCase();
 if(type==="relay_status"){
  if(data.status==="connected")connectorStatus("TikTok LIVE connecté : @quizzzz123_");
  else connectorStatus("Relais en ligne, attente de TikTok LIVE pour @quizzzz123_… Nouvelle vérification automatique côté serveur.");
  return;
 }
 const userData=(data.user&&typeof data.user==="object")?data.user:{};
 const username=String(data.username||userData.uniqueId||userData.displayId||userData.nickname||data.nickname||data.uniqueId||data.sender||(typeof data.user==="string"?data.user:"")).trim();
 const message=String(data.comment||data.message||data.text||"").trim();
 if(["chat","comment","message"].includes(type)){
  const match=message.toUpperCase().match(/\b([ABCD])\b/);
  if(username && match)submitAnswer(username,match[1]);
  return;
 }
 if(["subscribe","subscription","subnotify","sub_notify"].includes(type)){
  if(username)subscribePlayer(username);
  return;
 }
 if(["like","likes"].includes(type)){
  updateLikes(Number(data.count||data.likeCount||data.amount||1));
  return;
 }
 if(["gift","gift_received"].includes(type)){
  const giftObject=(data.gift&&typeof data.gift==="object")?data.gift:{};
  const gift=String(data.giftName||giftObject.name||data.gift||data.giftType||"").toLowerCase();
  if(!username)return;
  if(gift.includes("rose")||gift.includes("🌹"))giveRose(username);
  else if(gift.includes("ice")||gift.includes("glaçon")||gift.includes("glacon"))freezeLeader(username);
  else if(gift.includes("bomb")||gift.includes("bombe"))bombLeader(username);
 }
}

function getPlayer(name){
 name=String(name||"").trim().slice(0,30);
 if(!name)return null;

 let player=players.find(p=>
  p.name.toLowerCase()===name.toLowerCase()
 );

 if(!player){
  player={
   name,
   score:0,
   subscribed:false,
   rosePending:false,
   answered:[]
  };
  players.push(player);
 }

 return player;
}

function sortedPlayers(){
 return players.slice().sort((a,b)=>
  b.score-a.score || a.name.localeCompare(b.name)
 );
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function getFrenchVoice(){
 if(!("speechSynthesis" in window))return null;

 const voices=speechSynthesis.getVoices();

 return voices.find(v=>
  v.lang.toLowerCase().startsWith("fr") &&
  /male|homme|thomas|henri|paul/i.test(v.name)
 )||voices.find(v=>
  v.lang.toLowerCase().startsWith("fr")
 )||null;
}

function processVoiceQueue(runId=voiceRunId){
 if(runId!==voiceRunId)return;
 if(speaking || !voiceEnabled)return;

 if(!voiceQueue.length){
  if(voiceSequenceCallback){
   const callback=voiceSequenceCallback;
   voiceSequenceCallback=null;
   callback();
  }
  return;
 }

 const text=voiceQueue.shift();
 const utterance=new SpeechSynthesisUtterance(text);
 const voice=getFrenchVoice();

 if(voice)utterance.voice=voice;

 utterance.lang="fr-FR";
 utterance.rate=0.95;
 utterance.pitch=0.88;
 utterance.volume=1;

 speaking=true;
 setAppleMusicDucking(true);

 utterance.onend=()=>{
  if(runId!==voiceRunId)return;
  speaking=false;
  if(!voiceQueue.length)setAppleMusicDucking(false);
  processVoiceQueue(runId);
 };

 utterance.onerror=()=>{
  if(runId!==voiceRunId)return;
  speaking=false;
  if(!voiceQueue.length)setAppleMusicDucking(false);
  processVoiceQueue(runId);
 };

 speechSynthesis.speak(utterance);
}

function speakSequence(messages,callback){
 /* Le quiz est prioritaire : une annonce cadeau en cours est interrompue,
    mais reste en tête de file pour être reprise pendant un prochain chrono. */
 stopLiveThanksForQuiz();
 voiceRunId++;
 const runId=voiceRunId;
 if("speechSynthesis" in window)speechSynthesis.cancel();
 voiceQueue=[];
 speaking=false;
 voiceSequenceCallback=null;
 if(!voiceEnabled || !("speechSynthesis" in window)){
  if(callback)callback();
  return;
 }
 voiceQueue=messages.slice();
 voiceSequenceCallback=callback||null;
 processVoiceQueue(runId);
}

const liveThanksQueue=[];
let liveThanksSpeaking=false;
let liveThanksUtterance=null;
let liveThanksOverflow=false;
let revealPendingForThanks=false;

function stopLiveThanksForQuiz(){
 if(!liveThanksSpeaking)return;
 liveThanksSpeaking=false;
 liveThanksUtterance=null;
}

/* Les remerciements utilisent une file séparée : ils ne bloquent jamais
   le chrono, la révélation ou le lancement de la question suivante. */
function playNextLiveThanks(){
 if(!voiceEnabled||liveThanksSpeaking||!liveThanksQueue.length||!("speechSynthesis" in window))return;
 if(!timer||revealed||gameFinished||seconds<2)return;
 liveThanksSpeaking=true;
 setAppleMusicDucking(true);
 const message=liveThanksQueue[0];
 const utterance=new SpeechSynthesisUtterance(message);
 const voice=getFrenchVoice();
 if(voice)utterance.voice=voice;
 utterance.lang="fr-FR";utterance.rate=1.12;utterance.pitch=.9;utterance.volume=1;
 liveThanksUtterance=utterance;
 const finish=(completed)=>{
  if(liveThanksUtterance!==utterance)return;
  liveThanksUtterance=null;
  liveThanksSpeaking=false;
  if(!speaking)setAppleMusicDucking(false);
  if(completed&&liveThanksQueue[0]===message)liveThanksQueue.shift();
  if(!liveThanksQueue.length)liveThanksOverflow=false;
  if(revealPendingForThanks){revealPendingForThanks=false;revealAnswer();return;}
  if(timer&&!revealed&&!gameFinished&&seconds>=2&&liveThanksQueue.length)playNextLiveThanks();
 };
 utterance.onend=()=>finish(true);
 utterance.onerror=()=>finish(false);
 speechSynthesis.speak(utterance);
}
function queueLiveThanks(message){
 /* File bornée : si les événements affluent, on les regroupe en un rappel
    global plutôt que de laisser une file interminable ralentir le quiz. */
 if(liveThanksQueue.length<8&&!liveThanksOverflow)liveThanksQueue.push(message);
 else if(!liveThanksOverflow){
  liveThanksQueue.push("Merci à tous pour vos abonnements et vos cadeaux ! Les effets sont affichés à l'écran.");
  liveThanksOverflow=true;
 }
 if(timer&&!revealed&&!gameFinished)playNextLiveThanks();
}
function speak(message){if(!voiceEnabled)return;speakSequence([message]);}

function activateVoice(){
 voiceEnabled=true;

 $("voiceButton").textContent="🔊 VOIX AUTOMATIQUE";
 $("voiceButton").classList.add("active");

 speakSequence([
  "La voix du quiz est activée.",
  "Bienvenue dans Quiz Culture G !",
  "Seize parties de vingt questions vous attendent."
 ],()=>{
  announceCurrentQuestion();
 });
}

  "Réponse C : "+q[2][2],
  "Réponse D : "+q[2][3]
 ];

 speakSequence(messages,()=>{
  if(!revealed&&!gameFinished){startTimer();playNextLiveThanks();}
 });
}

 }
}

function startTimer(){
 if(gameFinished || revealed)return;

 clearInterval(timer);
 seconds=ROUND_SECONDS;
 updateTimer();

 timer=setInterval(()=>{
  seconds--;
  updateTimer();

  if(seconds<=0){
   clearInterval(timer);
   timer=null;
   if(liveThanksSpeaking){revealPendingForThanks=true;}
   else revealAnswer();
  }
 },1000);
}

}

function addVoteTickerEntry(player){

 const empty=ticker.querySelector(".vote-pill");
 if(empty&&empty.textContent.includes("En attente"))empty.remove();
 const pill=document.createElement("span");pill.className="vote-pill";
 pill.textContent=String(player.name).slice(0,24)+(player.subscribed?" ⭐":"");
 ticker.appendChild(pill);
 while(ticker.children.length>70)ticker.removeChild(ticker.firstChild);
 ticker.scrollTo({left:ticker.scrollWidth,behavior:"smooth"});
}
function submitAnswer(username,letter){
 if(gameFinished || revealed || roundValidated)return;

 const player=getPlayer(username);
 if(!player)return;

 letter=String(letter||"").trim().toUpperCase();
 const answerIndex="ABCD".indexOf(letter);

 if(answerIndex===-1)return;
 if(player.answered.includes(questionIndex))return;

 player.answered.push(questionIndex);
 renderRanking();
 addVoteTickerEntry(player);

 roundAnswers.push({
  player,
  answerIndex,
  order:roundAnswers.length
 });

 const count=roundAnswers.length;
 $("voteCount").textContent=count+" RÉPONSE"+(count>1?"S":"");

 $("bottomStatus").textContent=
  "RÉPONSE ENREGISTRÉE — "+count+" PARTICIPANT"+(count>1?"S":"");
}

/* =========================================================
   ATTRIBUTION DES POINTS
========================================================= */

function validateRound(){
 if(roundValidated)return null;
 roundValidated=true;

 const correctIndex=questions[questionIndex][3];

 const correctAnswers=roundAnswers.filter(entry=>
  entry.answerIndex===correctIndex &&
  !frozenThisRound.includes(entry.player.name)
 );

 const firstCorrect=correctAnswers.length
  ?correctAnswers[0].player
  :null;

 correctAnswers.forEach((entry,index)=>{
  const player=entry.player;
  const basePoints=Math.max(50,200-index*10);
  const roseMultiplier=player.roseActive?2:1;
  const subscriptionMultiplier=player.subscribed?2:1;
  const globalMultiplier=globalDoubleActive?2:1;

  player.score+=basePoints*
   roseMultiplier*
   subscriptionMultiplier*
   globalMultiplier;
 });

 players.forEach(player=>{
  player.roseActive=false;
 });

 renderRanking();

 $("bottomStatus").textContent=
  correctAnswers.length+
  " BONNE(S) RÉPONSE(S) — POINTS ATTRIBUÉS";

 return firstCorrect;
}

/* =========================================================
   RÉVÉLATION DE LA RÉPONSE
========================================================= */

function revealAnswer(){
 if(revealed || gameFinished)return;

 clearInterval(timer);
 timer=null;
 revealed=true;

 const firstCorrect=validateRound();
 const q=questions[questionIndex];
 const correctIndex=q[3];

 const totalVotes=roundAnswers.length;
 const voteTotals=[0,0,0,0];
 roundAnswers.forEach(entry=>voteTotals[entry.answerIndex]++);
 document.querySelectorAll(".answer").forEach((el,i)=>{
  el.classList.add(i===correctIndex?"correct":"wrong");
  const percent=totalVotes?Math.round(voteTotals[i]/totalVotes*100):0;
  const badge=document.createElement("span");
  badge.className="answer-percent";
  badge.textContent=percent+"%";
  el.appendChild(badge);
 });

 $("bottomStatus").textContent=
  "RÉPONSE RÉVÉLÉE — CLASSEMENT MIS À JOUR";

 const messages=[
  "La bonne réponse était : "+q[2][correctIndex]+"."
 ];

 if(firstCorrect){
  messages.push(
   "Bravo "+firstCorrect.name+
   " ! Tu as trouvé en premier !"
  );
 }

 speakSequence(messages,()=>{
  if(questionIndex%QUESTIONS_PER_PART===9){
   showMidGameRecap(false);
  }else if((questionIndex+1)%QUESTIONS_PER_PART===0){
   showPartPodium();
  }else{
   setTimeout(nextQuestion,1200);
  }
 });
}

/* Glaçon : bloque le leader pendant la prochaine question seulement. */
function freezeLeader(username){
 const leader=sortedPlayers()[0];
 if(!leader)return;

 if(!frozenNextRound.includes(leader.name)){
  frozenNextRound.push(leader.name);
 }

 showTickerMessage(
  "🧊 "+leader.name.toUpperCase()+" EST GELÉ POUR LA PROCHAINE MANCHE !",
  "highlight",
  6000
 );

 $("bottomStatus").textContent=

 queueLiveThanks(username+" utilise un glaçon ! "+leader.name+" ne pourra pas marquer de points à la prochaine manche !");
}

/* Bombe : vole la moitié des points du premier et les transfère. */
function bombLeader(username){
 const sender=getPlayer(username);
 if(!sender)return;

 const leader=sortedPlayers()[0];
 if(!leader || leader.name===sender.name)return;

 const stolen=Math.floor(leader.score/2);
 if(stolen<=0)return;

 leader.score-=stolen;
 sender.score+=stolen;

 renderRanking();

 $("bottomStatus").textContent=
  "💣 "+sender.name+" VOLE "+stolen+" POINTS À "+leader.name+" !";

 showTickerMessage(
  "💣 "+sender.name.toUpperCase()+" VIENT DE VOLER "+stolen+" POINTS À "+leader.name.toUpperCase()+" !",
  "highlight",
  6000
 );

 queueLiveThanks("Bombe ! "+sender.name+" vole la moitié des points de "+leader.name+" !");
}

let specialCountdownInterval=null;
function startSpecialCountdown(label,seconds,callback){
 clearInterval(specialCountdownInterval);clearTimeout(recapTimeout);
 let remaining=seconds;
 const target=$("specialCountdown");
 if(target)target.textContent=label+" "+remaining+" secondes…";
 specialCountdownInterval=setInterval(()=>{

  if(current)current.textContent=remaining>0?label+" "+remaining+" seconde"+(remaining>1?"s":"")+"…":"C'est reparti !";
  if(remaining<=0){clearInterval(specialCountdownInterval);specialCountdownInterval=null;recapTimeout=setTimeout(callback,350);}
 },1000);

}

}

/* =========================================================
   AMBIANCE MUSICALE ORIGINALE — QUIZ TV JOYEUX ET DISCRET
========================================================= */
let appleMusicDuckActive=false;
let freeMusicBaseVolume=0.006;
let freeMusicContext=null;
let freeMusicMaster=null;
let freeMusicTimer=null;
let freeMusicStep=0;
function freeMusicStatus(message){const el=$("freeMusicStatus");if(el)el.textContent=message;}
function setFreeMusicVolume(value){
 freeMusicBaseVolume=Math.max(0,Math.min(.02,Number(value)/100));
 if(freeMusicMaster&&freeMusicContext){
  freeMusicMaster.gain.setTargetAtTime(freeMusicBaseVolume*(appleMusicDuckActive ? .08 : 1),freeMusicContext.currentTime,.12);
 }
}
function setAppleMusicDucking(active){
 appleMusicDuckActive=!!active;
 if(freeMusicMaster&&freeMusicContext){
  freeMusicMaster.gain.setTargetAtTime(freeMusicBaseVolume*(appleMusicDuckActive ? .08 : 1),freeMusicContext.currentTime,.18);
 }
}
function playMusicChord(){
 if(!freeMusicContext||!freeMusicMaster)return;
 const ctx=freeMusicContext;
 // Accords majeurs simples et lumineux, ambiance plateau TV conviviale.
 const chords=[
  [60,64,67],[65,69,72],[67,71,74],[60,64,67]
 ];
 const notes=chords[freeMusicStep%chords.length];
 const now=ctx.currentTime;
 // Petit tapis doux, sans nappes graves ni tension harmonique.
 notes.forEach((midi,index)=>{
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=440*Math.pow(2,(midi-69)/12);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(index===0 ? .045 : .032,now+.45);
  gain.gain.setTargetAtTime(.0001,now+2.35,.38);
  osc.connect(gain);gain.connect(freeMusicMaster);
  osc.start(now);osc.stop(now+3.7);
 });
 // Quelques notes aiguës rondes et espacées pour donner un côté jeu télévisé.
 const melody=[notes[2]+12,notes[1]+12,notes[2]+12,notes[0]+12];
 [0.25,1.05,1.85,2.65].forEach((offset,index)=>{
  const pluck=ctx.createOscillator();
  const pluckGain=ctx.createGain();
  pluck.type="triangle";
  pluck.frequency.value=440*Math.pow(2,(melody[index]-69)/12);
  pluckGain.gain.setValueAtTime(.0001,now+offset);
  pluckGain.gain.linearRampToValueAtTime(.035,now+offset+.06);
  pluckGain.gain.exponentialRampToValueAtTime(.0001,now+offset+.48);
  pluck.connect(pluckGain);pluckGain.connect(freeMusicMaster);
  pluck.start(now+offset);pluck.stop(now+offset+.52);
 });
 freeMusicStep++;
}
async function playFreeMusic(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx){freeMusicStatus("Ce navigateur ne prend pas en charge l’ambiance audio.");return;}
  if(!freeMusicContext){
   freeMusicContext=new AudioCtx();
   freeMusicMaster=freeMusicContext.createGain();
   freeMusicMaster.gain.value=freeMusicBaseVolume*(appleMusicDuckActive ? .08 : 1);
   freeMusicMaster.connect(freeMusicContext.destination);
   freeMusicStep=0;
  }
  await freeMusicContext.resume();
  if(freeMusicTimer===null){
   playMusicChord();
   freeMusicTimer=setInterval(playMusicChord,4000);
  }
  freeMusicStatus("Ambiance jeu télévisé douce en lecture. Volume très bas, encore réduit pendant la voix du quiz.");
 }catch(error){
  freeMusicStatus("Impossible de démarrer l’ambiance audio dans ce navigateur.");
 }
}
async function toggleLiveMusic(){
 const button=$("liveMusicToggle");
 if(freeMusicTimer===null){
  await playFreeMusic();
  if(button)button.textContent="♫ MUSIQUE ACTIVE — PAUSE";
 }else{
  await pauseFreeMusic();
  if(button)button.textContent="♫ RELANCER LA MUSIQUE";
 }
}
async function pauseFreeMusic(){
 if(freeMusicContext&&freeMusicContext.state==="running"){
  if(freeMusicTimer!==null){clearInterval(freeMusicTimer);freeMusicTimer=null;}
  await freeMusicContext.suspend();
  freeMusicStatus("Ambiance en pause.");
 }else freeMusicStatus("L’ambiance n’est pas en lecture.");
}
async function stopFreeMusic(){
 if(freeMusicTimer!==null){clearInterval(freeMusicTimer);freeMusicTimer=null;}
 if(freeMusicContext){
  const oldContext=freeMusicContext;
  freeMusicContext=null;freeMusicMaster=null;freeMusicStep=0;
  try{await oldContext.close();}catch(e){}
 }
 freeMusicStatus("Ambiance arrêtée.");
}
